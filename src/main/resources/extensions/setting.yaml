apiVersion: v1alpha1
kind: Setting
metadata:
  name: traffic-monitor-setting
spec:
  forms:
    - group: rules
      label: "监控与告警"
      formSchema:
        - $formkit: checkbox
          name: enabled
          label: "启用访问监控"
          value: true
        - $formkit: checkbox
          name: trustProxyHeaders
          label: "信任反向代理 IP 请求头"
          help: "仅当 Nginx/Cloudflare 会覆盖 X-Forwarded-For 时开启，避免客户端伪造 IP。"
          value: false
        - $formkit: checkbox
          name: includeApiTraffic
          label: "统计 API 请求"
          value: false
        - $formkit: checkbox
          name: ignoreStaticResources
          label: "忽略图片/JS/CSS 等静态资源"
          value: true
        - $formkit: textarea
          name: ipWhitelist
          label: "IP 白名单"
          help: "白名单 IP 跳过自动和手动封禁；支持单 IP、IPv4/IPv6 CIDR，使用换行、逗号或空格分隔。请先填入管理端出口 IP。"
          value: |-
            127.0.0.1
            ::1
        - $formkit: checkbox
          name: autoBlockFailedLogins
          label: "登录失败达到阈值时自动封禁 IP"
          value: true
        - $formkit: number
          name: failedLoginThreshold
          label: "登录失败封禁阈值"
          help: "同一 IP 在统计窗口内达到该次数后立即封禁。"
          min: 1
          value: 5
        - $formkit: number
          name: failedLoginWindowMinutes
          label: "登录失败统计窗口（分钟）"
          min: 1
          value: 10
        - $formkit: number
          name: blockDurationMinutes
          label: "自动封禁时长（分钟）"
          min: 1
          value: 1440
        - $formkit: checkbox
          name: autoBlockTrafficAnomalies
          label: "异常流量告警后自动封禁 24 小时"
          help: "适用于速率、带宽、单次大流量、5xx 爆发和扫描路径告警；白名单地址始终放行。"
          value: true
        - $formkit: checkbox
          name: captureResponseHeaders
          label: "保存响应头用于请求详情"
          value: true
        - $formkit: checkbox
          name: captureResponseBody
          label: "保存文本响应正文用于请求详情"
          help: "仅保存文本、JSON、XML、HTML 等响应，二进制响应只记录大小和类型。"
          value: true
        - $formkit: number
          name: responseBodyMaxBytes
          label: "单条响应正文保存上限（bytes）"
          min: 1024
          max: 1048576
          value: 32768
        - $formkit: number
          name: maxStoredRecords
          label: "最多保存请求明细条数"
          min: 100
          max: 20000
          value: 2000
        - $formkit: number
          name: requestsPerMinuteThreshold
          label: "单 IP 每分钟请求数阈值"
          min: 1
          value: 120
        - $formkit: number
          name: bytesPerMinuteThreshold
          label: "单 IP 每分钟流量阈值（bytes）"
          min: 1
          value: 52428800
        - $formkit: number
          name: singleRequestBytesThreshold
          label: "单次请求总流量阈值（bytes）"
          min: 1
          value: 10485760
        - $formkit: number
          name: serverErrorsPerMinuteThreshold
          label: "单 IP 每分钟 5xx 错误阈值"
          min: 1
          value: 10
        - $formkit: number
          name: alertCooldownSeconds
          label: "同类告警冷却时间（秒）"
          min: 1
          value: 60
