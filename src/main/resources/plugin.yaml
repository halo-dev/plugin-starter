# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: traffic-monitor
spec:
  enabled: true
  requires: ">=2.25.0"
  settingName: traffic-monitor-setting
  configMapName: traffic-monitor-configmap
  author:
    name: Halo Traffic Monitor
  logo: logo.png
  displayName: "IP 流量监控"
  description: "实时统计 IP 访问、请求/响应流量，并对异常速率、带宽、错误和扫描路径告警。"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/halo-dev/plugin-starter/blob/main/LICENSE"
